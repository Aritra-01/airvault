<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirVault — Local Network File Server & Media Streamer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { 900: '#090d16', 800: '#111827', 700: '#1f2937', 600: '#374151' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-dark-800 border-b border-gray-800 sticky top-0 z-40 px-6 py-4 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md shadow-blue-500/20">
        <i class="fa-solid fa-vault text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          AirVault <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full font-medium">Local LAN Server</span>
        </h1>
        <p class="text-xs text-gray-400" id="server-status">Connected to local network storage</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <div class="relative hidden sm:block">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
          <i class="fa-solid fa-search"></i>
        </span>
        <input type="text" id="search-input" placeholder="Search files in current view..." class="bg-dark-700 text-sm text-gray-200 pl-10 pr-4 py-2 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 w-64 transition">
      </div>
      <button onclick="refreshCurrentDir()" class="bg-dark-700 hover:bg-dark-600 text-gray-300 px-3.5 py-2 rounded-lg text-sm border border-gray-700 transition flex items-center gap-2">
        <i class="fa-solid fa-rotate-right"></i> <span class="hidden md:inline">Refresh</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 flex flex-col gap-6">

    <!-- Breadcrumb & Stats Bar -->
    <div class="bg-dark-800 border border-gray-800 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-sm">
      <nav class="flex items-center space-x-2 text-sm overflow-x-auto w-full pb-1 sm:pb-0" id="breadcrumb">
        <!-- Breadcrumbs injected dynamically -->
      </nav>
      <div class="text-xs text-gray-400 flex items-center gap-4 whitespace-nowrap">
        <span id="item-count">0 items</span>
        <span id="storage-info"></span>
      </div>
    </div>

    <!-- File Browser Table -->
    <div class="bg-dark-800 border border-gray-800 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-gray-800 text-xs font-semibold text-gray-400 uppercase bg-dark-700/50">
              <th class="py-3.5 px-6">Name</th>
              <th class="py-3.5 px-4 w-32">Size</th>
              <th class="py-3.5 px-4 w-44 hidden md:table-cell">Modified</th>
              <th class="py-3.5 px-6 text-right w-40">Actions</th>
            </tr>
          </thead>
          <tbody id="file-list" class="divide-y divide-gray-800/60 text-sm">
            <!-- Files injected dynamically -->
          </tbody>
        </table>
      </div>
      <div id="empty-state" class="hidden py-16 text-center text-gray-500">
        <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
        <p class="text-base">This directory is empty</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark-800 border-t border-gray-800 py-4 px-6 text-center text-xs text-gray-500">
    AirVault Local Server • Access via Wi-Fi IP address on any PC, Android, or Smart TV.
  </footer>

  <!-- Modal Player / Viewer -->
  <div id="media-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex flex-col items-center justify-center p-4">
    <div class="absolute top-6 right-6 flex items-center gap-3 z-10">
      <a id="modal-download-btn" href="#" download class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-lg">
        <i class="fa-solid fa-download"></i> Download
      </a>
      <button onclick="closeModal()" class="bg-dark-700 hover:bg-dark-600 text-gray-300 w-10 h-10 rounded-lg flex items-center justify-center text-lg transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="w-full max-w-5xl max-h-[85vh] flex flex-col items-center justify-center relative">
      <div id="modal-content" class="w-full h-full flex items-center justify-center overflow-auto rounded-xl">
        <!-- Dynamic media player or viewer -->
      </div>
      <div id="modal-title" class="mt-4 text-sm font-medium text-gray-300"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
